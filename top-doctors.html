<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Top doctors · Passova</title>
  <meta name="description" content="The doctors who marked the most patients as seen this month.">
  <link rel="icon" href="assets/passova-logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="app-body auth-pending">

  <main class="page">
    <div class="page-head">
      <div>
        <h1 class="page-title">Top doctors</h1>
        <p class="section-sub">Most patients and endorsements marked as seen in the month.</p>
      </div>
      <div class="month-switch" role="group" aria-label="Choose month">
        <button class="icon-btn" type="button" id="prev-month" aria-label="Previous month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="month-label" id="month-label" aria-live="polite">&nbsp;</span>
        <button class="icon-btn" type="button" id="next-month" aria-label="Next month">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <ol class="podium" id="podium" aria-label="Top three doctors"></ol>

    <p class="my-rank card" id="my-rank" hidden></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/core.js"></script>
  <script src="js/top-doctors.js"></script>
</body>
</html>
